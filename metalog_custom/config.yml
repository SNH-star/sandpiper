# metalog_custom config
#
# Fetches the latest Metalog (SPIRE) extended metadata and joins it onto
# Sandpiper's kingfisher metadata, producing the meta_* column slim file
# consumed by the parsed_metadata stage. This is normally driven end-to-end by
# the fetch_metalog / join_metalog_metadata rules in ../snakemake/Snakefile
# (toggled by INCLUDE_METALOG in prod_config.yml). Each build passes its own
# --download-dir, --output-dir and the freshly pulled kingfisher metadata, so
# the values below are only the defaults for a manual/local run.
#
# Relative paths are resolved against the directory holding this file, so the
# repo can live anywhere.
#
# Workflow (manual):
#   1. pixi run -e sandpiper python scripts/fetch_metalog.py --config config.yml
#      -> downloads the four "_latest" files into METALOG_DOWNLOAD_DIR
#   2. pixi run -e sandpiper python scripts/join_metadata.py --config config.yml
#      -> writes OUTPUT_FILE (full) and SLIM_OUTPUT_FILE (run + meta_ columns)

# Metalog source (SPIRE). fetch_metalog.py downloads the four "_latest" wide
# files from here; the _latest URLs redirect to the current dated release, so
# re-running fetch always pulls fresh metadata -- no manual file copying.
METALOG_BASE_URL:     'https://metalog.embl.de/static/download/metadata'
METALOG_DOWNLOAD_DIR: 'metalog_downloads'

# Extended metadata files (SPIRE metalog) -- populated by fetch_metalog.py.
METALOG_ANIMAL:        'metalog_downloads/animal_extended_wide_latest.tsv.gz'
METALOG_ENVIRONMENTAL: 'metalog_downloads/environmental_extended_wide_latest.tsv.gz'
METALOG_HUMAN:         'metalog_downloads/human_extended_wide_latest.tsv.gz'
METALOG_OCEAN:         'metalog_downloads/ocean_extended_wide_latest.tsv.gz'

# Sandpiper kingfisher metadata (join source) for a manual run. A build joins
# against the metadata it has just pulled, via --kingfisher-metadata-list.
KINGFISHER_METADATA: '/scratch/microbiome/sandpiper2-gtdb-renew/final_SRA_v2/kingfisher_metadata.tsv'

# Output directory for a manual run (a build passes its own via --output-dir).
OUTPUT_DIR: 'outputs'

# Output file name (full: all kingfisher columns + meta_ columns)
OUTPUT_FILE: 'kingfisher_metadata_extended.tsv'

# Slim output (run + meta_ columns, matched runs only) -- fed to the sandpiper pipeline
SLIM_OUTPUT_FILE: 'kingfisher_metadata_meta_slim.tsv'
