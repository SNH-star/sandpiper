# Regenerates the IndicPiper habitat-indicator genus table from THIS build's
# own data every run (build_indicpiper_metadata -> build_indicpiper_genus ->
# run_indicpiper -> add_indicpiper_scores_to_backend_db -- see indicpiper_custom/),
# then loads it into indicator_habitat_scores. This is genuinely heavy
# (phase genus + run_indicpiper together take ~8-10+ hours on a 300GB job) --
# set INCLUDE_INDICPIPER: false to skip the whole chain and reproduce the
# exact prior DB instead.
INCLUDE_INDICPIPER: true
# Top-N-by-count habitats to include, unattended (see indicpiper_custom's own
# config.yml for the interactive MIN_HABITAT_SAMPLES alternative this
# overrides) -- 30 is what was validated interactively against v40 data.
