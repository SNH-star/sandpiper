<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <meta property="og:title" content="Sandpiper" />
    <meta property="og:description" content="Browse and download public metagenomic datasets" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sandpiper.qut.edu.au" />
    <meta property="og:image" content="https://sandpiper.qut.edu.au/og-preview.png" /> <!-- TODO: add og-preview.png to static assets before release -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <title>sandpiper</title>

    <!-- Open Graph / Twitter link-preview metadata. These MUST stay static in
         this file (not set from within the Vue app) since social crawlers
         (Twitter/X, Slack, etc.) read the raw HTML and never execute JS.
         og-preview.png lives in vue/public/ and is regenerated per the
         release script's checklist step. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sandpiper" />
    <meta property="og:description" content="Browse SingleM metagenome profiles from public sequencing data." />
    <meta property="og:url" content="https://sandpiper.qut.edu.au/" />
    <meta property="og:image" content="https://sandpiper.qut.edu.au/og-preview.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sandpiper" />
    <meta name="twitter:description" content="Browse SingleM metagenome profiles from public sequencing data." />
    <meta name="twitter:image" content="https://sandpiper.qut.edu.au/og-preview.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
